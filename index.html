
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ICO-AR-001 · Edificio B</title>

  <meta name="description" content="Proyecto de realidad aumentada del Edificio B del Centro Universitario UAEM Valle de Teotihuacán.">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Escena de realidad aumentada */
    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Encabezado */
    #intro {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 15px;
      padding-top: calc(12px + env(safe-area-inset-top));
      text-align: center;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.75),
        rgba(0, 0, 0, 0.15)
      );
      pointer-events: none;
    }

    #intro h1 {
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 600;
      color: #a7e8bb;
    }

    #intro p {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Estado de la realidad aumentada */
    #status {
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.4;
      color: #fff;
    }

    /* Evita interferencias con la cámara */
    #intro,
    #status {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>

<body>

  <!-- Información y estado -->
  <div id="intro">
    <h1>ICO-AR-001 · Edificio B</h1>
    <p>Permite el acceso a la cámara y apunta al marcador impreso.</p>
    <div id="status">Preparando realidad aumentada…</div>
  </div>

  <!-- Escena AR -->
  <a-scene
    embedded
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: true;
      maxTrack: 1;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true">

    <!-- Recursos -->
    <a-assets>
      <a-asset-item
        id="building"
        src="./assets/EdificioB.glb">
      </a-asset-item>
    </a-assets>

    <!-- Cámara AR -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Target del marcador -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Modelo 3D del Edificio B -->
      <a-gltf-model
        id="buildingModel"
        src="#building"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.25 0.25 0.25">
      </a-gltf-model>

    </a-entity>

  </a-scene>

  <!-- Diagnóstico -->
  <script>
    const scene = document.querySelector("a-scene");
    const status = document.querySelector("#status");
    const target = document.querySelector("[mindar-image-target]");
    const model = document.querySelector("#buildingModel");

    // Escena inicializada
    scene.addEventListener("loaded", () => {
      status.textContent = "Escena cargada. Iniciando cámara…";
    });

    // AR listo
    scene.addEventListener("arReady", () => {
      status.textContent = "Cámara activa. Apunta al marcador del Edificio B.";
    });

    // Error de AR
    scene.addEventListener("arError", (event) => {
      console.error("Error de MindAR:", event);
      status.textContent = "No se pudo iniciar AR. Revisa el permiso de cámara.";
    });

    // Marcador detectado
    target.addEventListener("targetFound", () => {
      status.textContent = "¡Marcador reconocido! Edificio B detectado.";
      console.log("Marcador detectado.");
    });

    // Marcador perdido
    target.addEventListener("targetLost", () => {
      status.textContent = "Marcador perdido. Vuelve a apuntar al marcador.";
      console.log("Marcador perdido.");
    });

    // Modelo cargado
    model.addEventListener("model-loaded", () => {
      console.log("EdificioB.glb cargado correctamente.");
    });

    // Error de carga del modelo
    model.addEventListener("model-error", (event) => {
      console.error("Error al cargar EdificioB.glb:", event);
      status.textContent = "Error al cargar el edificio 3D.";
    });
  </script>

</body>
</html>
