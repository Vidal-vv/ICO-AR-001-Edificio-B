
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edificio B - Realidad Aumentada</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    .ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a-scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #start-button {
      position: fixed;
      z-index: 1000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      background: #087f45;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      z-index: 1001;
      top: 15px;
      left: 10px;
      right: 10px;
      padding: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div id="status">Sistema preparado. Presiona iniciar.</div>

  <button id="start-button">
    INICIAR REALIDAD AUMENTADA
  </button>

  <div class="ar-container">

    <a-scene
      mindar-image="
        imageTargetSrc: ./assets/targets.mind;
        autoStart: false;
        maxTrack: 1;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
      "
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>

      <!-- Marcador del edificio -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Objeto de prueba -->
        <a-box
          position="0 0.1 0"
          width="0.15"
          height="0.15"
          depth="0.15"
          color="#00FF88"
        ></a-box>

      </a-entity>

    </a-scene>

  </div>

  <script>
    const startButton = document.querySelector("#start-button");
    const statusText = document.querySelector("#status");
    const scene = document.querySelector("a-scene");

    let arStarted = false;

    startButton.addEventListener("click", async () => {

      if (arStarted) return;

      try {
        statusText.textContent = "Iniciando cámara...";
        startButton.disabled = true;

        const arSystem = scene.systems["mindar-image-system"];

        await arSystem.start();

        arStarted = true;

        startButton.classList.add("hidden");
        statusText.textContent = "Cámara activa. Busca el marcador.";

      } catch (error) {

        console.error("Error al iniciar AR:", error);

        statusText.textContent =
          "No se pudo iniciar la cámara. Revisa los permisos.";

        startButton.disabled = false;
      }
    });

    scene.addEventListener("arReady", () => {
      statusText.textContent =
        "Realidad aumentada lista. Busca el marcador.";
    });

    scene.addEventListener("arError", (event) => {
      console.error("Error de realidad aumentada:", event);
      statusText.textContent =
        "Error al iniciar la realidad aumentada.";
    });

    scene.addEventListener("targetFound", () => {
      statusText.textContent = "¡Marcador detectado!";
    });

    scene.addEventListener("targetLost", () => {
      statusText.textContent =
        "Marcador perdido. Busca nuevamente.";
    });
  </script>

</body>
</html>
