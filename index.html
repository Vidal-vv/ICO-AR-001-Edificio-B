
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ICO-AR-001 | Prueba de seguimiento</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #info {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.65);
      z-index: 999;
      pointer-events: none;
    }

    #info h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    #status {
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="info">
    <h1>ICO-AR-001 · Edificio B</h1>
    <p id="status">Iniciando seguimiento de imagen...</p>
  </div>

  <a-scene
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: true;
      maxTrack: 1;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Marcador -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Figura de prueba -->
      <a-box
        position="0 0.1 0"
        width="0.15"
        height="0.15"
        depth="0.15"
        color="#00FF88">
      </a-box>

    </a-entity>

  </a-scene>

  <script>
    const status = document.getElementById("status");
    const scene = document.querySelector("a-scene");
    const target = document.querySelector("[mindar-image-target]");

    scene.addEventListener("arReady", () => {
      status.textContent = "Cámara activa. Busca el marcador.";
    });

    scene.addEventListener("arError", (event) => {
      console.error("Error de AR:", event);
      status.textContent = "Error al iniciar realidad aumentada.";
    });

    target.addEventListener("targetFound", () => {
      status.textContent = "¡Marcador reconocido!";
    });

    target.addEventListener("targetLost", () => {
      status.textContent = "Marcador perdido. Apunta nuevamente.";
    });
  </script>

</body>
</html>
