
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ICO-AR-001 | Prueba de cámara</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #info {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 15px;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      text-align: center;
      z-index: 10;
    }

    #info h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    #status {
      font-size: 14px;
    }

    #start {
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      border: 0;
      border-radius: 12px;
      background: #187c43;
      color: white;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline muted></video>

  <div id="info">
    <h1>ICO-AR-001 · Edificio B</h1>
    <p id="status">Cámara sin iniciar</p>
  </div>

  <button id="start">Activar cámara</button>

  <script>
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const start = document.getElementById("start");

    start.addEventListener("click", async () => {
      try {
        status.textContent = "Solicitando cámara...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;

        await video.play();

        start.style.display = "none";
        status.textContent = "Cámara activa · Prueba de imagen";

      } catch (error) {
        status.textContent = "Error de cámara: " + error.message;
        console.error(error);
      }
    });
  </script>

</body>
</html>
